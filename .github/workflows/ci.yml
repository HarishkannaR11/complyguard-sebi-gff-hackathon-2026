name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: regops
          POSTGRES_PASSWORD: regops
          POSTGRES_DB: regops
        # Host port 5433 matches the repo's default DATABASE_URL (see docker-compose.yml).
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U regops -d regops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://regops:regops@localhost:5433/regops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the sentence-transformers install small and fast.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Migrations apply cleanly on Postgres and match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infra:
    # Keeps the deployment files from rotting: Terraform formatting + validation for both stacks,
    # the production compose file, the Caddyfile, and the Dockerfiles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive deploy

      - name: terraform validate (ec2)
        working-directory: deploy/ec2/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: terraform validate (ecs)
        working-directory: deploy/ecs/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: docker compose config
        working-directory: deploy/ec2
        run: POSTGRES_PASSWORD=x GROQ_API_KEY=x docker compose -f docker-compose.prod.yml config -q

      - name: Caddyfile
        working-directory: deploy/ec2
        run: |
          docker run --rm -e SITE_ADDRESS=example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Dockerfile lint
        run: |
          docker build --check .
          docker build --check frontend

      - name: shell syntax
        run: bash -n deploy/ecs/deploy.sh
